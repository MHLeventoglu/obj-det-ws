__include__: [
  './datasetv1_grid_740x600_6crop_detection.yml',
  '../../models/RT-DETR/rtdetrv2_pytorch/configs/runtime.yml',
  '../../models/RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/include/dataloader.yml',
  '../../models/RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/include/optimizer.yml',
