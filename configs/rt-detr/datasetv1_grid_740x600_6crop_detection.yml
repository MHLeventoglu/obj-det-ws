task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

# Prepared dataset zip layout:
#   datasets/datasetv1_grid_740x600_6crop/
#   ├── train/{images,labels}
#   ├── val/{images,labels}
#   ├── test/{images,labels}
#   └── annotations/{train.json,val.json}
#
# Rough image counts used for training schedule:
#   train: ~54000
#   val: ~19500
#
# COCO image file_name values are relative to the dataset root, for example:
#   train/images/example__slice_740x600_x0_y0.jpg
#
# RTDETRv2 custom datasets use category_id values directly when
# remap_mscoco_category is False. Keep COCO annotation category_id values in
# the 0..3 range below.
num_classes: 4
class_names: ['arac', 'insan', 'uap', 'uai']
remap_mscoco_category: False

# Paths are relative to models/RT-DETR/rtdetrv2_pytorch/ (the working directory).
train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ../../../datasets/datasetv1_grid_740x600_6crop
    ann_file: ../../../datasets/datasetv1_grid_740x600_6crop/annotations/train.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: ../../../datasets/datasetv1_grid_740x600_6crop
    ann_file: ../../../datasets/datasetv1_grid_740x600_6crop/annotations/val.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
