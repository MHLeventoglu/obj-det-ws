__include__: [
  './plane_44k_detection.yml',
  '../../models/D-FINE/configs/runtime.yml',
  '../../models/D-FINE/configs/dfine/include/dataloader.yml',
  '../../models/D-FINE/configs/dfine/include/optimizer.yml',
  '../../models/D-FINE/configs/dfine/include/dfine_hgnetv2.yml',
]

output_dir: ./output/dfine_hgnetv2_n_plane_44k
project_name: D-FINE
exp_name: dfine_hgnetv2_n_plane_44k

# The default Colab notebook tunes from dfine_n_obj2coco.pth.
# The checkpoint head is in COCO class order; COCO class id 4 is airplane.
pretrain_class_ids: [4]
pretrain_class_id_offset: 0

# If you tune from a pure Objects365 checkpoint instead, set
# pretrain_class_ids: [114] and pretrain_class_id_offset: 1, or remove the
# COCO pretrain_class_ids override above so the fallback obj365_ids is used.
obj365_ids: [114]

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

HybridEncoder:
  in_channels: [512, 1024]
  feat_strides: [16, 32]

  # intra
  hidden_dim: 128
  use_encoder_idx: [1]
  dim_feedforward: 512

  # cross
  expansion: 0.34
  depth_mult: 0.5

DFINETransformer:
  feat_channels: [128, 128]
  feat_strides: [16, 32]
  hidden_dim: 128
  dim_feedforward: 512
  num_levels: 2

  num_layers: 3
  eval_idx: -1

  num_points: [6, 6]

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0004
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0004
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0008
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# 44k-image plane dataset fine-tuning schedule.
epochs: 72
train_dataloader:
  total_batch_size: 64
  num_workers: 8
  dataset:
    transforms:
      policy:
        epoch: 64
  collate_fn:
    stop_epoch: 64
    ema_restart_decay: 0.9999
    base_size_repeat: ~

val_dataloader:
  total_batch_size: 128
  num_workers: 8

ema:
  warmups: 0

lr_warmup_scheduler:
  warmup_duration: 0
