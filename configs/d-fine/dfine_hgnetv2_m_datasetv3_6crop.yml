__include__: [
  './datasetv3_6crop_detection.yml',
  '../../models/D-FINE/configs/runtime.yml',
  '../../models/D-FINE/configs/dfine/include/dataloader.yml',
  '../../models/D-FINE/configs/dfine/include/optimizer.yml',
  '../../models/D-FINE/configs/dfine/include/dfine_hgnetv2.yml',
]

output_dir: ./output/dfine_hgnetv2_m_datasetv3_6crop
project_name: D-FINE
exp_name: dfine_hgnetv2_m_datasetv3_6crop

# Objects365 class ids used to initialize the custom class head in dataset order:
#   0 arac  -> Car
#   1 insan -> Person
#   2 uap   -> Airplane
#   3 uai   -> Helicopter
# Not used when fine-tuning via `--tuning` from an already-4-class checkpoint
# (pretrain/current tensor shapes match, so map_class_weights short-circuits),
# kept only for config-shape consistency with the other dfine_hgnetv2_m_* configs.
obj365_ids: [5, 0, 114, 263]

DFINE:
  backbone: HGNetv2

HGNetv2:
  name: 'B2'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True

DFINETransformer:
  num_layers: 4
  eval_idx: -1

HybridEncoder:
  in_channels: [384, 768, 1536]
  hidden_dim: 256
  depth_mult: 0.67

# Fine-tune (warm start) from a PREVIOUS 6crop run's best_stg1.pth/best_stg2.pth
# via `--tuning` (weights only, no optimizer/EMA/scheduler state) instead of
# `--resume` -- same pattern as dfine_hgnetv2_m_datasetv2_2crop_augmented.yml.
# Pass the checkpoint on the CLI:
#   python scripts/d-fine/train.py --config configs/d-fine/dfine_hgnetv2_m_datasetv3_6crop.yml \
#     --tuning /path/to/dfine_hgnetv2_m_datasetv1_grid_740x600_6crop/best_stg1.pth
# (best_stg2.pth -- the post no-aug-tail checkpoint -- is usually the better
# starting point than best_stg1.pth if both exist; either works with --tuning.)
# LR is lowered vs. the from-scratch schedule
# (dfine_hgnetv2_m_datasetv1_grid_740x600_6crop.yml) since the backbone/encoder/
# decoder already converged on this task.
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.000125

epochs: 45
train_dataloader:
  total_batch_size: 48
  num_workers: 8
  dataset:
    transforms:
      policy:
        epoch: 38
  collate_fn:
    stop_epoch: 38
    ema_restart_decay: 0.9999
    base_size_repeat: 6

val_dataloader:
  total_batch_size: 64
  num_workers: 8

ema:
  warmups: 0

# Short warmup instead of the previous 0 (disabled) since the optimizer state
# is reset from scratch here (tuning, not resume).
lr_warmup_scheduler:
  warmup_duration: 500
