model: yolo11m.pt
data: configs/yolov11/datasetv4_2crop.yaml

train:
  epochs: 150
  imgsz: 640
  batch: 120
  device: null
  workers: 8
  project: outputs/yolov11
  name: yolo11m_datasetv4_2crop
  exist_ok: true
  amp: true
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  cos_lr: true
  patience: 32
  close_mosaic: 10
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.35
  degrees: 20.0
  translate: 0.1
  scale: 0.4
  shear: 0.0
  perspective: 0.00025
  fliplr: 0.5
  flipud: 0.0
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.3

# Prepared dataset zip expected locally at:
#   datasets/datasetv4_2crop/
#   ├── images/{train,val}
#   ├── labels/{train,val}
#   ├── annotation_train.json
#   ├── annotation_val.json
#   ├── classes.txt
#   └── data.yaml
#
# Rough image count used for training schedule:
#   train: ~24000, val: ~5500
#
# Epoch/batch budget approximated from the datasetv2_2crop preset (same
# order of magnitude train size, same 2-crop augmentation regime); no D-FINE
# equivalent config exists yet for this dataset variant.
#
# Class order (same 0..3 order as the workspace standard, different display
# names for this dataset's classes.txt):
#   0: Tasit
#   1: Insan
#   2: Uap
#   3: Uai
#
# Augmentation notes for ~75-85 deg near-nadir drone imagery (not true 90 deg
# top-down): the gimbal tilt is fixed relative to the airframe, so every
# frame has a consistent near/far asymmetry along one image axis (e.g. top
# of frame slightly more distant/compressed). This rules out flipud (would
# invert that asymmetry into a geometry that never occurs in capture) and
# caps degrees well below full rotation (large rotation would swap that
# fixed axis onto a diagonal, same problem in a milder form). degrees=20
# only covers realistic yaw/roll flight jitter. perspective=0.00025 adds a
# light touch of robustness to the exact tilt angle varying (75-85 deg,
# gimbal drift) without over-distorting the image -- kept deliberately
# small since it's a secondary effect next to degrees/copy_paste/mosaic.
#
# Small/sparse 'Insan' class: copy_paste raised to 0.3 (strongest known lever
# for rare/small classes), mixup dropped to 0.0 (alpha-blending further
# degrades an already low signal-to-noise small object), close_mosaic
# lowered to 10 so mosaic -- which raises small-object density per batch --
# stays active longer into training.
