model: yolo11m.pt
data: configs/yolov11/datasetv1_grid_740x600_6crop.yaml

train:
  epochs: 80
  imgsz: 640
  batch: 96
  device: null
  workers: 8
  project: outputs/yolov11
  name: yolo11m_datasetv1_grid_740x600_6crop
  exist_ok: true
  amp: true
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  cos_lr: true
  patience: 25
  close_mosaic: 10
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.35
  degrees: 5.0
  translate: 0.1
  scale: 0.4
  shear: 0.0
  perspective: 0.0
  fliplr: 0.5
  flipud: 0.0
  mosaic: 1.0
  mixup: 0.05
  copy_paste: 0.0

# Prepared dataset zip expected locally at:
#   datasets/datasetv1_grid_740x600_6crop/
#   ├── train/{images,labels}
#   ├── val/{images,labels}
#   ├── test/{images,labels}
#   ├── annotations/{train.json,val.json}
#   └── data.yaml
#
# Rough image counts used for training schedule:
#   train: ~54000
#   val: ~19500
#
# Class order:
#   0: arac
#   1: insan
#   2: uap
#   3: uai
