# Fine-tune (warm start) from a previous 6crop run's best.pt -- Ultralytics
# loads `model:` weights and continues training (no --resume/optimizer-state
# reuse), which is already the fine-tune pattern used by
# yolo11m_datasetv2_6crop.yaml. Default below points at the SAME base
# checkpoint that datasetv2_6crop was fine-tuned from (v1 6crop, no Heridal),
# so v2 (Heridal ~11%) and v3 (Heridal ~35-40%) are a clean apples-to-apples
# ablation of the Heridal ratio change. Point this at
# yolo11m_datasetv2_6crop's best.pt instead if you'd rather continue the
# fine-tune chain than isolate the ratio change.
model: /content/drive/MyDrive/HYZ_2026/egitim-sonuclari/yolov11_runs/yolo11m_datasetv1_grid_740x600_6crop/yolo11m_datasetv1_grid_740x600_6crop/weights/best.pt
data: configs/yolov11/datasetv3_6crop.yaml

train:
  epochs: 90
  imgsz: 640
  batch: 78
  device: null
  workers: 8
  project: outputs/yolov11
  name: yolo11m_datasetv3_6crop
  exist_ok: true
  amp: true
  optimizer: AdamW
  lr0: 0.00005
  lrf: 0.01
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  cos_lr: true
  patience: 15
  close_mosaic: 10
  hsv_h: 0.015
  hsv_s: 0.5
  hsv_v: 0.35
  degrees: 5.0
  translate: 0.1
  scale: 0.4
  shear: 0.0
  perspective: 0.0
  fliplr: 0.5
  flipud: 0.0
  mosaic: 1.0
  mixup: 0.05
  copy_paste: 0.0
